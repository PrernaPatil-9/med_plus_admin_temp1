    .tab-btn { padding: 0.5rem 1.25rem; border-radius: 2rem; font-weight: 500; transition: 0.2s; background: transparent; color: #64748b; border: none; cursor: pointer; }
    .tab-btn.active { background: #0f2b4b; color: white; }
    .tab-btn:hover:not(.active) { background: #eef2f6; }
    input, select, textarea { border-radius: 0.75rem; border: 1px solid #e2e8f0; padding: 0.6rem 1rem; width: 100%; transition: 0.2s; font-size: 0.875rem; }
    input:focus, select:focus, textarea:focus { border-color: #0f2b4b; outline: none; box-shadow: 0 0 0 3px rgba(15,43,75,0.08); }
    input[type="color"] { padding: 0.25rem; height: 2.6rem; cursor: pointer; }
    input[type="file"] { padding: 0.4rem; }
    .section-item { border: 1px solid #eef2f6; border-radius: 1rem; padding: 1rem; margin-bottom: 0.75rem; background: white; transition: 0.2s; cursor: grab; }
    .section-item:hover { border-color: #ec4899; }
    .section-item.dragging { opacity: 0.4; }
    .section-item .drag-handle { cursor: grab; color: #94a3b8; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
    .stat-mini { background: #f8fafc; border-radius: 1rem; padding: 0.75rem 1rem; border: 1px solid #eef2f6; }
    .field-block { border: 1px solid #f1f5f9; border-radius: 1rem; padding: 1.25rem; margin-bottom: 1rem; }
    .field-block h5 { font-weight: 600; color: #374151; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; font-size: 0.95rem; }
    .field-label { display: block; font-size: 0.75rem; font-weight: 500; color: #6b7280; margin-bottom: 0.2rem; }
    .sub-item { border: 1px solid #f1f5f9; border-radius: 0.9rem; padding: 0.9rem; margin-bottom: 0.6rem; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.02); position: relative; }
    .sub-item-index { font-size: 0.68rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 0.5rem; }
    .sub-item-remove { position: absolute; top: 0.75rem; right: 0.75rem; color: #fb7185; cursor: pointer; font-size: 0.8rem; }
    .sub-item-remove:hover { color: #e11d48; }
    .icon-btn { width: 1.9rem; height: 1.9rem; display: inline-flex; align-items: center; justify-content: center; border-radius: 9999px; color: #94a3b8; border: 1px solid #eef2f6; background: white; font-size: 0.72rem; cursor: pointer; transition: 0.2s; }
    .icon-btn:hover { background: #eef2f6; color: #0f2b4b; }
    .icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .icon-btn.danger:hover { color: #e11d48; background: #fff1f2; }
    .icon-btn.success { color: #10b981; }
    .icon-btn.success:hover { background: #d1fae5; color: #059669; }
    .library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.75rem; }
    .library-card { border: 1px solid #eef2f6; border-radius: 1rem; padding: 1rem; background: #f8fafc; cursor: pointer; transition: 0.2s; text-align: left; }
    .library-card:hover { border-color: #ec4899; background: white; box-shadow: 0 8px 20px rgba(0,0,0,0.05); transform: translateY(-2px); }
    .library-card i { color: #0f2b4b; font-size: 1.2rem; margin-bottom: 0.5rem; display: block; }
    .library-card .lib-label { font-weight: 600; font-size: 0.85rem; color: #1f2937; }
    .library-card .lib-desc { font-size: 0.72rem; color: #94a3b8; margin-top: 0.15rem; }
    .link-action { font-size: 0.85rem; font-weight: 500; color: #db2777; background: none; border: none; cursor: pointer; }
    .link-action:hover { text-decoration: underline; }
    .theme-swatch { width: 100%; height: 3.5rem; border-radius: 0.75rem; border: 1px solid #eef2f6; }
    .banner-preview { width: 100%; height: 120px; object-fit: cover; border-radius: 0.5rem; border: 1px solid #eef2f6; }
    .image-thumb { width: 80px; height: 80px; object-fit: cover; border-radius: 0.5rem; border: 1px solid #eef2f6; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: white; border-radius: 1.5rem; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 2rem; }
    .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.75rem; }

    .image-grid-item:hover { border-color: #ec4899; background: #fdf2f8; }

    function loadData() {
      const stored = localStorage.getItem('novena_cms_data');
      if (stored) {
        try { appData = JSON.parse(stored); } catch(e) { appData = JSON.parse(JSON.stringify(defaultData)); }
      } else { appData = JSON.parse(JSON.stringify(defaultData)); }
      if (!appData.theme) appData.theme = defaultData.theme;
      if (!appData.content || !appData.content.home) appData.content = defaultData.content;
      if (!appData.sections || !appData.sections.home) appData.sections = defaultData.sections;
      if (!appData.media) appData.media = defaultData.media;
      if (!appData.banners) appData.banners = defaultData.banners;
      saveData();
      renderTab();
      updateStats();
    }

    function saveData() {
      localStorage.setItem('novena_cms_data', JSON.stringify(appData));
      updateStats();
    }

    function updateStats() {
      const count = appData.sections.home?.length || 0;
      document.getElementById('sectionCount').textContent = count;
      document.getElementById('sectionBadge').textContent = count + ' sections';
      const json = JSON.stringify(appData.content.home || {});
      const fields = (json.match(/":/g) || []).length;
      const media = (json.match(/"(bgImage|image|images|logo|logos)"\s*:/gi) || []).length;
      document.getElementById('fieldCount').textContent = fields;
      document.getElementById('mediaCount').textContent = media + (appData.banners?.length || 0);
    }

    function switchTab(tab) {
      currentTab = tab;
      pickerOpen = false; replaceTargetId = null;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => {
        if (b.textContent.toLowerCase().includes(tab)) b.classList.add('active');
      });
      renderTab();
    }

    function renderTab() {
      const container = document.getElementById('tabContent');
      if (currentTab === 'content') renderContent(container);
      else if (currentTab === 'sections') renderSections(container);
      else if (currentTab === 'theme') renderTheme(container);
      else if (currentTab === 'media') renderMedia(container);
      else if (currentTab === 'banners') renderBanners(container);
    }

    // ============================================================
    // CONTENT TAB
    // ============================================================
    function renderContent(container) {
      const order = appData.sections.home;
      if (!order.length) {
        container.innerHTML = `<p class="text-sm text-gray-400">No sections yet. Add one from the <button class="link-action" onclick="switchTab('sections')">Sections</button> tab.</p>`;
        return;
      }
      container.innerHTML = `<div class="space-y-6">${order.map(sec => renderSectionEditor(sec)).join('')}</div>`;
    }

    function renderSectionEditor(sec) {
      const lib = SECTION_LIBRARY[sec.type];
      const data = appData.content.home[sec.id] || {};
      let body = '';
      switch (sec.type) {
        case 'hero': body = editorHero(sec.id, data); break;
        case 'features': body = editorFeatures(sec.id, data); break;
        case 'partners': body = editorPartners(sec.id, data); break;
        case 'about': body = editorAbout(sec.id, data); break;
        case 'counters': body = editorCounters(sec.id, data); break;
        case 'services': body = editorServices(sec.id, data); break;
        case 'appointment': body = editorAppointment(sec.id, data); break;
        case 'testimonials': body = editorTestimonials(sec.id, data); break;
        default: body = `<p class="text-sm text-gray-400">Unknown section type.</p>`;
      }
      const grad = lib ? lib.grad : 'from-gray-50/50 to-white';
      const icon = lib ? lib.icon : 'fa-cube';
      const iconColor = lib ? lib.iconColor : 'text-gray-400';
      const label = lib ? lib.label : sec.type;
      return `
        <div class="border rounded-xl p-5 bg-gradient-to-br ${grad}">
          <h5><i class="fas ${icon} ${iconColor}"></i>${label}</h5>
          ${body}
        </div>
      `;
    }

    // ---- field helpers ----
    function textField(label, value, onchange, extra) {
      return `<div class="${extra||''}"><label class="field-label">${label}</label><input type="text" value="${escAttr(value || '')}" onchange="${onchange}" class="mt-1" /></div>`;
    }
    function textareaField(label, value, onchange, rows) {
      return `<div class="md:col-span-2"><label class="field-label">${label}</label><textarea rows="${rows || 2}" onchange="${onchange}" class="mt-1">${escHtml(value || '')}</textarea></div>`;
    }
    function escAttr(s) { return String(s).replace(/"/g, '&quot;'); }
    function escHtml(s) { return String(s).replace(/</g, '&lt;'); }

    // ---- HERO ----
    function editorHero(id, data) {
      const slides = data.slides || [];
      return `
        <div class="flex items-center justify-between mb-3">
          <p class="text-xs text-gray-400">${slides.length} slide(s) in rotation</p>
          <button class="link-action" onclick="addArrayItem('${id}','slides',{tag:'New Slide',heading:'Placeholder headline',headingAccent:'goes here',paragraph:'Placeholder paragraph text.',buttonText:'Learn More',buttonLink:'#',bgImage:'/images/placeholder-banner.jpg'})"><i class="fas fa-plus mr-1"></i> Add slide</button>
        </div>
        ${slides.map((s, i) => `
          <div class="sub-item">
            <span class="sub-item-index">Slide ${i+1}</span>
            ${slides.length > 1 ? `<span class="sub-item-remove" onclick="removeArrayItem('${id}','slides',${i})"><i class="fas fa-times"></i></span>` : ''}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              ${textField('Eyebrow tag', s.tag, `updateArrayItem('${id}','slides',${i},'tag',this.value)`)}
              ${textField('Heading', s.heading, `updateArrayItem('${id}','slides',${i},'heading',this.value)`)}
              ${textField('Heading accent', s.headingAccent, `updateArrayItem('${id}','slides',${i},'headingAccent',this.value)`)}
              ${textField('Button text', s.buttonText, `updateArrayItem('${id}','slides',${i},'buttonText',this.value)`)}
              ${textField('Button link', s.buttonLink, `updateArrayItem('${id}','slides',${i},'buttonLink',this.value)`)}
              ${textField('Background image', s.bgImage, `updateArrayItem('${id}','slides',${i},'bgImage',this.value)`)}

            </div>
          </div>

    }

    function editorAbout(id, data) {

              <div><label class="field-label">Accent color</label>

                  ${['blue','rose','cyan','emerald','purple','pink'].map(cl => `<option value="${cl}" ${c.color===cl?'selected':''}>${cl}</option>`).join('')}
                </select></div>
              ${textField('Image URL', c.image, `updateArrayItem('${id}','cards',${i},'image',this.value)`)}
              ${textareaField('Description', c.desc, `updateArrayItem('${id}','cards',${i},'desc',this.value)`)}

    function editorAppointment(id, data) {
      return `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          ${textField('Heading', data.heading, `updateContent('${id}','heading',this.value)`)}
          ${textField('Phone number', data.phone, `updateContent('${id}','phone',this.value)`)}
          ${textField('WhatsApp number (digits only)', data.whatsappNumber, `updateContent('${id}','whatsappNumber',this.value)`)}
          ${textField('Image', data.image, `updateContent('${id}','image',this.value)`)}
          ${textField('Happy patients stat', data.happyPatients, `updateContent('${id}','happyPatients',this.value)`)}
          ${textField('Satisfaction stat', data.satisfaction, `updateContent('${id}','satisfaction',this.value)`)}
          ${textareaField('Subheading', data.subheading, `updateContent('${id}','subheading',this.value)`)}
        </div>

    // ---- TESTIMONIALS ----
    function editorTestimonials(id, data) {
      const cards = data.cards || [];
      return `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
          ${textField('Heading', data.heading, `updateContent('${id}','heading',this.value)`)}
          ${textField('Heading accent', data.headingAccent, `updateContent('${id}','headingAccent',this.value)`)}
          ${textareaField('Subheading', data.subheading, `updateContent('${id}','subheading',this.value)`)}
        </div>
        <div class="flex items-center justify-between mb-2">
          <p class="text-xs text-gray-400">${cards.length} testimonial(s)</p>
          <button class="link-action" onclick="addArrayItem('${id}','cards',{name:'Placeholder Name',role:'Placeholder Role',quote:'Placeholder testimonial text.',rating:5,colorFrom:'#1e3a6f',colorTo:'#2d5a9e'})"><i class="fas fa-plus mr-1"></i> Add testimonial</button>
        </div>
        ${cards.map((c, i) => `

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              ${textField('Name', c.name, `updateArrayItem('${id}','cards',${i},'name',this.value)`)}
              ${textField('Role', c.role, `updateArrayItem('${id}','cards',${i},'role',this.value)`)}
              <div><label class="field-label">Rating (1-5)</label><input class="mt-1" type="number" min="1" max="5" value="${c.rating}" onchange="updateArrayItem('${id}','cards',${i},'rating',parseInt(this.value)||5)" /></div>
              <div class="grid grid-cols-2 gap-2">
                <div><label class="field-label">Color from</label><input type="color" value="${c.colorFrom}" onchange="updateArrayItem('${id}','cards',${i},'colorFrom',this.value)" /></div>

    // ============================================================
    // SECTIONS TAB
    // ============================================================
    function renderSections(container) {
      const order = appData.sections.home || [];
      container.innerHTML = `
        <div>
          <p class="text-sm text-gray-500 mb-4 flex items-center gap-2"><i class="fas fa-arrows-alt text-pink-400"></i> Drag to reorder, or use the arrows. Order here is the order on the live page.</p>
          <div class="space-y-2" id="sectionList">
            ${order.map((sec, idx) => {
              const lib = SECTION_LIBRARY[sec.type];
              return `
              <div class="section-item flex items-center justify-between" draggable="true" data-index="${idx}">
                <div class="flex items-center gap-3">
                  <span class="drag-handle"><i class="fas fa-grip-vertical"></i></span>
                  <i class="fas ${lib ? lib.icon : 'fa-cube'} text-pink-500"></i>
                  <span class="font-medium">${lib ? lib.label : sec.type}</span>
                  <span class="text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">${idx+1}</span>
                </div>
                <div class="flex items-center gap-1.5">
                  <button class="icon-btn" onclick="moveSection(${idx},-1)" ${idx===0?'disabled':''} title="Move up"><i class="fas fa-chevron-up"></i></button>
                  <button class="icon-btn" onclick="moveSection(${idx},1)" ${idx===order.length-1?'disabled':''} title="Move down"><i class="fas fa-chevron-down"></i></button>
                  <button class="icon-btn" onclick="openReplacePicker('${sec.id}')" title="Replace section type"><i class="fas fa-sync-alt"></i></button>
                  <button class="icon-btn danger" onclick="removeSection(${idx})" title="Remove"><i class="fas fa-trash-alt"></i></button>
                </div>
              </div>
            `; }).join('') || `<p class="text-sm text-gray-400">No sections yet — add one below.</p>`}
          </div>

          <button onclick="openAddPicker()" class="mt-4 text-sm text-pink-600 hover:underline">
            <i class="fas fa-plus mr-1"></i> Add Section
          </button>

          ${pickerOpen ? renderLibraryPicker() : ''}
        </div>
      `;
      // Drag-drop
      document.querySelectorAll('.section-item').forEach(el => {
        el.addEventListener('dragstart', function(e) { this.classList.add('dragging'); });
        el.addEventListener('dragend', function(e) { this.classList.remove('dragging'); });
        el.addEventListener('dragover', function(e) { e.preventDefault(); });
        el.addEventListener('drop', function(e) {
          e.preventDefault();
          const from = parseInt(document.querySelector('.dragging')?.dataset.index);
          const to = parseInt(this.dataset.index);
          if (from !== undefined && from !== to) {
            const sections = appData.sections.home;
            const [removed] = sections.splice(from, 1);
            sections.splice(to, 0, removed);
            saveData();
            renderSections(container);
          }
        });
      });
    }

    function renderLibraryPicker() {
      return `
        <div class="border rounded-xl p-5 bg-gray-50 mt-4">
          <div class="flex items-center justify-between mb-3">
            <h5 class="font-semibold text-gray-700 text-sm">${replaceTargetId ? 'Choose a new type — its content will reset to placeholder data.' : 'Choose a section type to add to the page.'}</h5>
            <button class="icon-btn" onclick="closePicker()" title="Cancel"><i class="fas fa-times"></i></button>
          </div>
          <div class="library-grid">
            ${Object.keys(SECTION_LIBRARY).map(type => {
              const lib = SECTION_LIBRARY[type];
              return `
              <button class="library-card" onclick="pickType('${type}')">
                <i class="fas ${lib.icon}"></i>
                <div class="lib-label">${lib.label}</div>
                <div class="lib-desc">${lib.desc}</div>
              </button>`;
            }).join('')}
          </div>
        </div>
      `;
    }

    function openAddPicker() { pickerOpen = true; replaceTargetId = null; renderSections(document.getElementById('tabContent')); }
    function openReplacePicker(id) { pickerOpen = true; replaceTargetId = id; renderSections(document.getElementById('tabContent')); }
    function closePicker() { pickerOpen = false; replaceTargetId = null; renderSections(document.getElementById('tabContent')); }

    function pickType(type) {
      const lib = SECTION_LIBRARY[type];
      if (replaceTargetId) {
        if (!confirm(`Replace this section with "${lib.label}"? Its current content will be reset to placeholder data.`)) return;
        const sec = appData.sections.home.find(s => s.id === replaceTargetId);
        sec.type = type;
        appData.content.home[replaceTargetId] = lib.defaultData();
      } else {
        const id = uid();
        appData.sections.home.push({ id, type });
        appData.content.home[id] = lib.defaultData();
      }
      pickerOpen = false; replaceTargetId = null;
      saveData();
      renderTab();
    }

    function moveSection(idx, dir) {
      const arr = appData.sections.home;
      const to = idx + dir;
      if (to < 0 || to >= arr.length) return;
      [arr[idx], arr[to]] = [arr[to], arr[idx]];
      saveData();
      renderSections(document.getElementById('tabContent'));
    }

    function removeSection(index) {
      if (confirm('Remove this section? Its content will be deleted.')) {
        const [removed] = appData.sections.home.splice(index, 1);
        delete appData.content.home[removed.id];
        saveData();
        renderTab();
      }
    }

    function updateTheme(key, value) {
      appData.theme[key] = value;
      saveData();
      renderTheme(document.getElementById('tabContent'));
    }

    function resetTheme() {
      if (confirm('Reset theme colors to the site default?')) {
        appData.theme = JSON.parse(JSON.stringify(defaultData.theme));
        saveData();
        renderTheme(document.getElementById('tabContent'));
      }
    }

    // ============================================================
    // MEDIA TAB
    // ============================================================
    function renderMedia(container) {
      const m = appData.media;
      container.innerHTML = `
        <div class="space-y-4">
          <p class="text-sm text-gray-500 mb-2">Section-specific images (hero banners, service photos, etc.) are edited inside each section on the <button class="link-action" onclick="switchTab('content')">Content</button> tab. This is just the shared site branding.</p>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="border rounded-xl p-4 bg-gray-50">
              <label class="block text-sm font-medium text-gray-700">Logo Mark</label>
              <input type="text" value="${escAttr(m.logos.main)}" maxlength="2" onchange="updateLogo('main',this.value)" class="mt-1" />
            </div>
            <div class="border rounded-xl p-4 bg-gray-50">
              <label class="block text-sm font-medium text-gray-700">Site Name</label>
              <input type="text" value="${escAttr(m.logos.text)}" onchange="updateLogo('text',this.value)" class="mt-1" />
            </div>
          </div>
        </div>
      `;
    }

    function updateLogo(key, value) {
      appData.media.logos[key] = value;
      saveData();
    }

    // ============================================================
    // BANNERS TAB — Full CRUD: add, edit, delete, view, reorder
    // ============================================================
    function renderBanners(container) {
      const banners = appData.banners || [];
      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <p class="text-sm text-gray-500">${banners.length} banner(s) in library. Drag to reorder.</p>
            <button class="link-action" onclick="showAddBannerModal()"><i class="fas fa-plus mr-1"></i> Add Banner</button>
          </div>
          <div class="space-y-3" id="bannerList">
            ${banners.map((b, idx) => `
              <div class="flex items-center gap-4 p-4 bg-gray-50 rounded-xl border hover:border-pink-200 transition cursor-grab" draggable="true" data-banner-index="${idx}">
                <span class="text-gray-400 cursor-grab"><i class="fas fa-grip-vertical"></i></span>
                <img src="${b.url}" alt="${b.alt}" class="banner-preview w-32 h-20 object-cover rounded-lg" />
                <div class="flex-1 min-w-0">
                  <p class="font-medium text-gray-800">${escHtml(b.name)}</p>
                  <p class="text-xs text-gray-400 truncate">${escHtml(b.url)}</p>
                  <p class="text-xs text-gray-400">${escHtml(b.alt)}</p>
                </div>
                <div class="flex items-center gap-1.5">
                  <button class="icon-btn success" onclick="viewBanner('${b.id}')" title="View"><i class="fas fa-eye"></i></button>
                  <button class="icon-btn" onclick="editBanner('${b.id}')" title="Edit"><i class="fas fa-pen"></i></button>
                  <button class="icon-btn danger" onclick="deleteBanner('${b.id}')" title="Delete"><i class="fas fa-trash-alt"></i></button>
                </div>
              </div>
            `).join('') || `<p class="text-sm text-gray-400">No banners yet. Click "Add Banner" to upload one.</p>`}
          </div>
        </div>
        ${showingBannerPreview ? renderBannerPreview() : ''}
      `;
      // Drag-drop for banners
      document.querySelectorAll('#bannerList > div').forEach(el => {
        el.addEventListener('dragstart', function(e) { this.classList.add('dragging'); });
        el.addEventListener('dragend', function(e) { this.classList.remove('dragging'); });
        el.addEventListener('dragover', function(e) { e.preventDefault(); });
        el.addEventListener('drop', function(e) {
          e.preventDefault();
          const from = parseInt(document.querySelector('#bannerList .dragging')?.dataset.bannerIndex);
          const to = parseInt(this.dataset.bannerIndex);
          if (from !== undefined && from !== to) {
            const banners = appData.banners;
            const [removed] = banners.splice(from, 1);
            banners.splice(to, 0, removed);
            saveData();
            renderBanners(container);
          }
        });
      });
    }

    function renderBannerPreview() {
      const b = appData.banners.find(b => b.id === showingBannerPreview);
      if (!b) return '';
      return `
        <div class="modal-overlay" onclick="closeBannerPreview(event)">
          <div class="modal-content" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between mb-4">
              <h4 class="font-bold text-lg">${escHtml(b.name)}</h4>
              <button class="icon-btn" onclick="closeBannerPreview()"><i class="fas fa-times"></i></button>
            </div>
            <img src="${b.url}" alt="${b.alt}" class="w-full rounded-lg" style="max-height: 400px; object-fit: contain;" />
            <p class="text-sm text-gray-500 mt-3"><strong>URL:</strong> ${escHtml(b.url)}</p>
            <p class="text-sm text-gray-500"><strong>Alt text:</strong> ${escHtml(b.alt)}</p>
          </div>
        </div>
      `;
    }

    function viewBanner(id) {
      showingBannerPreview = id;
      renderBanners(document.getElementById('tabContent'));
    }

    function closeBannerPreview(e) {
      if (e && e.target !== e.currentTarget) return;
      showingBannerPreview = null;
      renderBanners(document.getElementById('tabContent'));
    }

    function showAddBannerModal() {
      const name = prompt('Enter banner name:');
      if (!name) return;
      const url = prompt('Enter image URL (or upload below):');
      if (!url) return;
      const alt = prompt('Enter alt text:') || name;
      appData.banners.push({ id: bid(), name, url, alt });
      saveData();
      renderBanners(document.getElementById('tabContent'));
    }

    function editBanner(id) {
      const b = appData.banners.find(b => b.id === id);
      if (!b) return;
      const name = prompt('Banner name:', b.name);
      if (name !== null && name !== '') b.name = name;
      const url = prompt('Image URL:', b.url);
      if (url !== null && url !== '') b.url = url;
      const alt = prompt('Alt text:', b.alt);
      if (alt !== null && alt !== '') b.alt = alt;
      saveData();
      renderBanners(document.getElementById('tabContent'));
    }

    function deleteBanner(id) {
      if (!confirm('Delete this banner?')) return;
      appData.banners = appData.banners.filter(b => b.id !== id);
      saveData();
      renderBanners(document.getElementById('tabContent'));
    }

    // ============================================================
    // generic mutation helpers
    // ============================================================
    function updateContent(sectionId, field, value) {
      if (!appData.content.home[sectionId]) appData.content.home[sectionId] = {};
      appData.content.home[sectionId][field] = value;
      saveData();
    }

    function updateArrayItem(sectionId, arrayKey, index, field, value) {
      appData.content.home[sectionId][arrayKey][index][field] = value;
      saveData();
    }

    function updateArrayIndex(sectionId, arrayKey, index, value) {
      appData.content.home[sectionId][arrayKey][index] = value;
      saveData();
    }

    function addArrayItem(sectionId, arrayKey, template) {
      if (!appData.content.home[sectionId][arrayKey]) appData.content.home[sectionId][arrayKey] = [];
      appData.content.home[sectionId][arrayKey].push(template);
      saveData();
      renderTab();
    }

    function removeArrayItem(sectionId, arrayKey, index) {
      appData.content.home[sectionId][arrayKey].splice(index, 1);
      saveData();
      renderTab();
    }

    function updateClock() {
      document.getElementById('liveTime').textContent = new Date().toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    loadData();
  </script>
</body>
</html>
